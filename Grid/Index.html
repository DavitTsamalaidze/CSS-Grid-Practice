<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Templates</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <main>
        <section class="grid1">
            <h1 class="item-1">1</h1>
            <h1 class="item-2">2</h1>
            <h1 class="item-3">3</h1>
            <h1 class="item-4">4</h1>
            <h1 class="item-5">5</h1>
            <h1 class="item-6">6</h1>
            <h1 class="item-7">7</h1>
            <h1 class="item-8">8</h1>
            <h1 class="item-9">9</h1>
            <h1 class="item-10">10</h1>
            <h1 class="item-11">11</h1>
            <h1 class="item-12">12</h1>
        </section>
        <section class="grid2">
            <h1 class="box-1">1</h1>
            <h1 class="box-2">2</h1>
            <h1 class="box-3">3</h1>
            <h1 class="box-4">4</h1>
            <h1 class="box-5">5</h1>
            <h1 class="box-6">6</h1>
            <h1 class="box-7">7</h1>
            <h1 class="box-8">8</h1>
        </section>
    </main>
</body>
</html>
